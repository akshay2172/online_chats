name: CI  
  
on:  
  push:  
    branches: [main]  
  pull_request:  
    branches: [main]  
  
jobs:  
  # ─── Backend ────────────────────────────────────────────  
  backend:  
    runs-on: ubuntu-latest  
  
    services:  
      mongo:  
        image: mongo:7  
        ports:  
          - 27017:27017  
  
    defaults:  
      run:  
        working-directory: backend  
  
    steps:  
      - uses: actions/checkout@v4  
  
      - uses: actions/setup-node@v4  
        with:  
          node-version: 20  
          cache: npm  
          cache-dependency-path: backend/package-lock.json  
  
      - name: Install dependencies  
        run: npm ci  
  
      - name: TypeScript compile check  
        run: npx tsc --noEmit  
  
      - name: Lint  
        run: npx eslint 'src/**/*.ts'  
  
      - name: Run tests  
        run: npx jest --passWithNoTests  
        env:  
          MONGODB_URI: mongodb://localhost:27017/db_user  
          JWT_SECRET: ci-test-secret  
          PORT: 3001  
  
      - name: Build (nest build)  
        run: npx nest build  
  
  # ─── Frontend ───────────────────────────────────────────  
  frontend:  
    runs-on: ubuntu-latest  
  
    defaults:  
      run:  
        working-directory: frontend  
  
    steps:  
      - uses: actions/checkout@v4  
  
      - uses: actions/setup-node@v4  
        with:  
          node-version: 20  
          cache: npm  
          cache-dependency-path: frontend/package-lock.json  
  
      - name: Install dependencies  
        run: npm ci  
  
      - name: TypeScript compile check  
        run: npx tsc --noEmit  
  
      - name: Build (next build)  
        run: npm run build  
        env:  
          NEXT_PUBLIC_API_URL: http://localhost:3001